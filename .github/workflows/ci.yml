name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest tests -q

  notebook-sanity:
    name: Integridad del cuaderno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que el .ipynb es válido y conserva sus salidas
        run: |
          pip install nbformat
          python - <<'PY'
          import nbformat
          nb = nbformat.read("IAdoc.ipynb", as_version=4)
          nbformat.validate(nb)
          imgs = sum(
              1 for c in nb.cells for o in c.get("outputs", [])
              if "image/png" in o.get("data", {})
          )
          print(f"Cuaderno válido: {len(nb.cells)} celdas, {imgs} figuras")
          assert imgs >= 11, f"Se han perdido figuras: {imgs}"
          errores = [
              (i, o["ename"]) for i, c in enumerate(nb.cells)
              for o in c.get("outputs", []) if o.get("output_type") == "error"
          ]
          assert not errores, f"Celdas con error: {errores}"
          PY
